<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KpopStickerStudio — 無損貼圖與梗圖工坊</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-badge">LOSSLESS</span>
      <h1>KpopStickerStudio</h1>
      <span class="subtitle">不修臉・零重繪・無損裁切與壓字</span>
    </div>
    <div class="topbar-actions">
      <button id="btnLoadAgentQueue" class="btn btn-secondary" title="載入由對話 Agent 配好詞條與裁切的佇列">🤖 載入 Agent 佇列</button>
      <button id="btnOpenFolder" class="btn btn-secondary">📂 開啟貼圖資料夾</button>
    </div>
  </header>

  <main class="workspace">
    <!-- 左欄：佇列 -->
    <aside class="panel queue-panel">
      <div class="panel-head">
        <h2>待處理佇列 <span id="queueCount" class="pill">0</span></h2>
        <button id="btnClearDone" class="btn-link">清除已完成</button>
      </div>

      <div id="dropZone" class="drop-zone">
        <div class="drop-title">Ctrl+V 直接貼圖 / 拖曳多張到此</div>
        <div class="drop-sub">純本機讀取，絕不修改原始檔案</div>
        <label class="btn btn-primary btn-sm upload-label">
          ＋ 選擇圖片
          <input id="fileInput" type="file" accept="image/*" multiple hidden />
        </label>
      </div>

      <div id="queueList" class="queue-list"></div>
    </aside>

    <!-- 中欄：互動畫布與預覽 -->
    <section class="stage-panel">
      <div class="stage-toolbar">
        <div class="segmented" id="viewTabs">
          <button data-view="split" class="active">並排對照</button>
          <button data-view="crop">僅裁切定位</button>
          <button data-view="preview">僅無損成品</button>
        </div>

        <div class="aspect-group" id="aspectGroup">
          <span class="toolbar-label">裁切比例</span>
          <button data-aspect="1:1" class="chip active">1:1</button>
          <button data-aspect="4:3" class="chip">4:3</button>
          <button data-aspect="3:4" class="chip">3:4</button>
          <button data-aspect="free" class="chip">自由</button>
          <button id="btnResetCrop" class="chip">重設</button>
        </div>
      </div>

      <div id="stageContainer" class="stage-container view-split">
        <!-- 裁切編輯畫布 -->
        <div class="canvas-card" id="cropCard">
          <div class="card-tag">原圖裁切框（拖曳框選、拖藍點調字位置）</div>
          <div class="canvas-wrap" id="cropWrap">
            <canvas id="cropCanvas"></canvas>
            <div id="emptyHint" class="empty-hint">
              按下 <strong>Ctrl+V</strong> 貼上複製的圖片，或拖曳多張照片進左側佇列開始製作
            </div>
          </div>
        </div>

        <!-- 真實無損成品預覽 -->
        <div class="canvas-card" id="previewCard">
          <div class="card-tag">
            <span>真實無損引擎輸出預覽</span>
            <span id="previewMeta" class="meta-badge">尚未載入</span>
          </div>
          <div class="preview-wrap checker-bg">
            <img id="previewImg" alt="成品預覽" hidden />
            <div id="previewLoading" class="preview-loading" hidden>渲染中...</div>
          </div>
        </div>
      </div>

      <div id="qualityAlert" class="alert-bar" hidden></div>

      <div class="stage-footer">
        <div class="filename-preview">
          <span class="muted">檔名預覽：</span>
          <code id="filenamePreview">請先輸入成員名或文字</code>
        </div>
        <div class="footer-actions">
          <label class="checkbox-inline">
            <input type="checkbox" id="chkAutoNext" checked />
            存檔後跳下一張
          </label>
          <button id="btnCopyPng" class="btn btn-secondary" disabled>📋 複製成品圖</button>
          <button id="btnSave" class="btn btn-accent" disabled>💾 無損儲存 (Ctrl+S)</button>
        </div>
      </div>
    </section>

    <!-- 右欄：設定與詞條 -->
    <aside class="panel control-panel">
      <div class="section">
        <label class="field-label">成員／人物名稱（檔名：人_字.png）</label>
        <input id="inputPerson" type="text" placeholder="例如：沅禧、Ahyeon、Rora" />
        <div id="quickMembers" class="chip-wrap"></div>
      </div>

      <div class="section">
        <div class="field-head">
          <label class="field-label">貼圖文字（支援 Enter 換行）</label>
          <button id="btnAiSuggest" class="btn btn-ai btn-xs">✨ AI 看圖想詞條</button>
        </div>
        <textarea id="inputText" rows="2" placeholder="輸入回訊息梗字，例如：在幹嘛"></textarea>

        <div id="aiSuggestBox" class="suggest-box" hidden>
          <div class="suggest-head">
            <span id="aiSuggestLabel">候選詞條</span>
          </div>
          <div id="aiSuggestChips" class="chip-wrap"></div>
        </div>

        <div class="caption-tabs" id="captionTabs"></div>
        <div id="quickCaptions" class="chip-wrap"></div>
      </div>

      <div class="section">
        <label class="field-label">版型模式</label>
        <div class="segmented full" id="modeGroup">
          <button data-mode="original" class="active">原圖方圖</button>
          <button data-mode="meme-bar">梗圖白條</button>
          <button data-mode="cutout">離線去背</button>
        </div>

        <!-- 原圖選項 -->
        <div id="optOriginal" class="sub-opts">
          <div class="row-2">
            <label>圓角半徑 <span id="valRadius">0</span>px
              <input id="rangeRadius" type="range" min="0" max="80" step="4" value="0" />
            </label>
            <label>解析度上限
              <select id="selectMaxSize">
                <option value="1024" selected>1024px（範例標準）</option>
                <option value="800">800px（聊天輕量）</option>
                <option value="512">512px（標準貼圖）</option>
                <option value="0">不縮小（原裁切）</option>
              </select>
            </label>
          </div>
        </div>

        <!-- 梗圖白條選項 -->
        <div id="optMemeBar" class="sub-opts" hidden>
          <div class="row-2">
            <label>文字條位置
              <select id="selectBarPos">
                <option value="top">上方白條</option>
                <option value="bottom" selected>下方白條</option>
              </select>
            </label>
            <label>白條底色
              <select id="selectBarBg">
                <option value="#FFFFFF" selected>純白底</option>
                <option value="#111111">純黑底</option>
              </select>
            </label>
          </div>
        </div>

        <!-- 去背選項 -->
        <div id="optCutout" class="sub-opts" hidden>
          <div class="row-2">
            <label>去背模型
              <select id="selectCutoutModel">
                <option value="birefnet-portrait" selected>BiRefNet 人像（主力）</option>
                <option value="isnet-general-use">ISNet 通用（備援）</option>
              </select>
            </label>
            <label>貼圖白邊 <span id="valOutline">8</span>px
              <input id="rangeOutline" type="range" min="0" max="20" step="1" value="8" />
            </label>
          </div>
          <div class="row-2">
            <label class="checkbox-inline">
              <input type="checkbox" id="chkShadow" checked /> 柔和微陰影
            </label>
            <label class="checkbox-inline">
              <input type="checkbox" id="chkSquareCanvas" checked /> 512 正方形畫布
            </label>
          </div>
          <label class="checkbox-inline">
            <input type="checkbox" id="chkLineWhiteBg" /> 補純白實底（防 LINE 透明變黑底）
          </label>
        </div>
      </div>

      <div class="section">
        <label class="field-label">文字排版與字體</label>
        <div class="row-2">
          <label>字體風格
            <select id="selectFont">
              <option value="bold" selected>範例中粗黑（預設）</option>
              <option value="heavy">綜藝超粗黑</option>
              <option value="serif">思源粗宋體</option>
              <option value="kai">標楷體（反差梗）</option>
              <option value="kr">韓文粗體</option>
            </select>
          </label>
          <label>字色與描邊
            <select id="selectStyle">
              <option value="classic" selected>白字＋俐落黑邊</option>
              <option value="heavy">白字＋粗黑邊</option>
              <option value="yellow">韓綜黃字黑邊</option>
              <option value="pink">白字＋櫻花粉邊</option>
              <option value="blue">白字＋亮藍邊</option>
              <option value="dark">黑字＋白邊</option>
            </select>
          </label>
        </div>

        <div class="row-2">
          <label>字體大小 <span id="valTextScale">11</span>%
            <input id="rangeTextScale" type="range" min="0.06" max="0.22" step="0.005" value="0.11" />
          </label>
          <label>描邊粗細 <span id="valStroke">6.8</span>%
            <input id="rangeStroke" type="range" min="0" max="0.18" step="0.004" value="0.068" />
          </label>
        </div>

        <div class="row-2">
          <label>快速定位
            <select id="selectTextPos">
              <option value="bottom" selected>底部置中</option>
              <option value="top">頂部置中</option>
              <option value="top-left">左上角</option>
              <option value="top-right">右上角</option>
              <option value="bottom-left">左下角</option>
              <option value="bottom-right">右下角</option>
              <option value="center">正中央</option>
            </select>
          </label>
          <label>旋轉角度 <span id="valAngle">0</span>°
            <input id="rangeAngle" type="range" min="-25" max="25" step="1" value="0" />
          </label>
        </div>
        <button id="btnResetTextPos" class="btn-link">重設為快捷定位（取消自訂拖曳座標）</button>
      </div>

      <div class="section">
        <label class="field-label">輸出位置與格式</label>
        <input id="inputOutputDir" type="text" />
        <div class="row-2">
          <label>無損格式
            <select id="selectFormat">
              <option value="png" selected>PNG（無損）</option>
              <option value="webp">WebP（無損）</option>
              <option value="jpg">JPG（實底 95%）</option>
            </select>
          </label>
          <label class="checkbox-inline" style="margin-top: 20px;">
            <input type="checkbox" id="chkOverwrite" /> 同名直接覆蓋
          </label>
        </div>
      </div>

      <div id="lastSavedBox" class="saved-box" hidden>
        <div class="saved-title">已儲存：<strong id="lastSavedName"></strong></div>
        <div class="saved-url-row">
          <span class="muted">手機同 Wi-Fi 直載：</span>
          <a id="lastSavedLink" href="#" target="_blank" rel="noopener">開啟連結</a>
        </div>
      </div>
    </aside>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
